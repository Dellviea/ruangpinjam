<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>PinjamRuang</title>
  <style>
    body { font-family: sans-serif; background: #F2F2F4; color: #141417; padding: 2rem; }
    pre { background: #fff; border: 1px solid #DEDEE3; border-radius: 6px; padding: 1rem; }
  </style>
</head>
<body>
  <h1>PinjamRuang: tes koneksi</h1>
  <p id="status">Menghubungi backend...</p>
  <pre id="hasil"></pre>
  <script>
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').textContent =
          'Server aktif · dilayani oleh ' + d.server;
        document.getElementById('hasil').textContent = JSON.stringify(d, null, 2);
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Backend tidak bisa dihubungi';
      });
  </script>
</body>
</html>
