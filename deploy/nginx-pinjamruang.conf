# nginx untuk PinjamRuang: menyajikan folder frontend/ dan meneruskan /api ke gunicorn.
# Pasang: sudo cp deploy/nginx-pinjamruang.conf /etc/nginx/sites-available/pinjamruang
#         sudo ln -s /etc/nginx/sites-available/pinjamruang /etc/nginx/sites-enabled/
#         sudo rm /etc/nginx/sites-enabled/default
# Lokasi repo diasumsikan /opt/pinjamruang.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/pinjamruang/frontend;
    index index.html;

    # API diteruskan ke gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Frontend (file statis). no-cache: browser selalu cek versi terbaru, jadi hasil git pull langsung terlihat.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
